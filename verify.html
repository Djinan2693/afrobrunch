<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Check your reservation — Afro Brunch</title>
  <meta name="description"
    content="Enter your Afro Brunch reservation number to check that your seat for September 27, 2026 is confirmed.">
  <meta name="robots" content="noindex">

  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Forum&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/afrobrunch.css">
</head>

<body class="vf-body">

  <main class="vf-main">

    <div class="vf-card">

      <a href="./index.html">
        <img src="./assets/images/afro-logo.jpeg" width="84" height="84" alt="Afro Brunch" class="afro-logo">
      </a>

      <p class="section-subtitle label-2">At The Door</p>
      <h1 class="headline-2">Check Your Reservation</h1>

      <p class="vf-msg vf-lead">
        Check that your seat is confirmed — or find your number again if you lost it.
      </p>

      <div class="bk-tabs vf-tabs" role="tablist" aria-label="How to search">
        <button type="button" class="bk-tab is-active" role="tab" aria-selected="true" data-mode="ref">
          I have my number
        </button>
        <button type="button" class="bk-tab" role="tab" aria-selected="false" data-mode="find">
          I lost my number
        </button>
      </div>

      <!-- recherche par numero de reservation -->
      <form class="vf-form" data-verify-form data-panel="ref">
        <label class="bk-label" for="vf-ref">Reservation number</label>

        <input type="text" id="vf-ref" class="input-field vf-ref-input" placeholder="AB26-XXXXXX"
          autocomplete="off" spellcheck="false" maxlength="14">

        <button type="submit" class="btn btn-secondary">
          <span class="text text-1">Check</span>
          <span class="text text-2" aria-hidden="true">Check</span>
        </button>
      </form>

      <!-- recherche par email (et par nom en mode staff) -->
      <form class="vf-form" data-find-form data-panel="find" hidden>
        <label class="bk-label" for="vf-email">Email address <span class="bk-req">*</span></label>

        <input type="email" id="vf-email" class="input-field" placeholder="the email you booked with"
          autocomplete="email" spellcheck="false">

        <label class="bk-label" for="vf-name">Name on the booking</label>

        <input type="text" id="vf-name" class="input-field" placeholder="optional — helps if you booked twice"
          autocomplete="name">

        <p class="bk-hint vf-hint" data-find-hint>
          We only show bookings made with this exact email address.
        </p>

        <button type="submit" class="btn btn-secondary">
          <span class="text text-1">Find My Booking</span>
          <span class="text text-2" aria-hidden="true">Find My Booking</span>
        </button>
      </form>

      <div data-verify-result></div>

      <a href="./index.html" class="vf-back">← Back to Afro Brunch</a>

    </div>

  </main>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/verify.js"></script>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
